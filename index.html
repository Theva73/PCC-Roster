    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        /* Make the first column (employee name) sticky */
        .sticky-col {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: #ffffff; /* Match cell bg */
        }
        /* Style for the table header (dates) */
        .header-cell {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 5;
            background-color: #f8fafc; /* Light gray bg for header */
        }
        /* Ensure header name cell is on top */
        .sticky-header-col {
            top: 0;
            left: 0;
            z-index: 15;
            background-color: #f1f5f9; /* Darker gray for corner */
        }
        
        /* Custom scrollbars for a cleaner look */
        .roster-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .roster-container::-webkit-scrollbar-track {
            background: #f1f1ff;
            border-radius: 10px;
        }
        .roster-container::-webkit-scrollbar-thumb {
            background: #a8a29e;
            border-radius: 10px;
        }
        .roster-container::-webkit-scrollbar-thumb:hover {
            background: #78716c;
        }

        /* Show delete button on row hover */
        .employee-row:hover .delete-btn {
            opacity: 1;
        }

        function renderRoster() {
            if (!isDataLoaded) return; // Don't render if data isn't loaded

            grid.innerHTML = ''; // Clear existing grid
            
            const date = new Date(currentYear, currentMonth);
            const monthName = date.toLocaleString('default', { month: 'long' });
            monthYearEl.textContent = `${monthName} ${currentYear}`;

            grid.appendChild(idHeader);

                dayNameSpan.textContent = dayName;

                }

                headerCell.appendChild(dayNameSpan);
                grid.appendChild(headerCell);

                    const teamHeader = createCell(currentTeam, 'header-cell text-left p-3 font-bold text-base text-indigo-700 bg-indigo-50 border-t border-b border-indigo-200');
                    teamHeader.style.gridColumn = `span ${gridCols}`;
                    grid.appendChild(teamHeader);
                }
                
                const rowCells = [];
                
                const nameCell = document.createElement('div');
                nameCell.className = 'employee-row sticky-col text-sm p-3 border-b border-gray-200 text-gray-700 font-medium flex justify-between items-center';
                nameCell.style.minWidth = '200px';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = emp.name;
                nameCell.appendChild(nameSpan);

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '&#215;'; // 'x'
                deleteBtn.className = 'delete-btn text-red-400 hover:text-red-700 font-bold text-xl ml-2 p-0 leading-none rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-100 opacity-0 transition-opacity duration-150';
                deleteBtn.title = `Delete ${emp.name}`;
                deleteBtn.addEventListener('click', () => {
                    openDeleteModal(emp.id, emp.name);
                });
                
                nameCell.appendChild(deleteBtn);
                grid.appendChild(nameCell);
                rowCells.push(nameCell);

                const rankCell = createCell(emp.rank, 'employee-row sticky-col text-sm p-3 border-b border-l border-gray-200 text-gray-600');
                rankCell.style.minWidth = '80px';
                rankCell.style.left = '200px';
                grid.appendChild(rankCell);
                rowCells.push(rankCell);
                
                const idCell = createCell(emp.id, 'employee-row sticky-col text-sm p-3 border-b border-l border-gray-200 text-gray-600');
                idCell.style.minWidth = '100px';
                idCell.style.left = '280px';
                grid.appendChild(idCell);
                rowCells.push(idCell);

                // Roster Data Cells
                for (let day = 1; day <= daysInMonth; day++) {
                    const fullDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    
                    const empRoster = rosterData[emp.id] || {};
                    const shift = empRoster[fullDate] || ''; // Default to empty
                    const shiftInfo = shiftCodes[shift] || shiftCodes[''];
                    
                    const dataCell = createCell(shiftInfo.text, `employee-row text-center p-3 border-b border-l border-gray-200 cursor-pointer hover:bg-gray-100 transition duration-150 font-semibold ${shiftInfo.color} ${shiftInfo.textColor}`);
                    
                    dataCell.addEventListener('click', () => {
                        openModal(dataCell, emp.id, emp.name, fullDate);
                    });
                    
                    grid.appendChild(dataCell);
                    rowCells.push(dataCell);
                }
                
                rowCells.forEach(cell => {
                    cell.addEventListener('mouseenter', () => {
                        rowCells.forEach(c => c.classList.add('bg-gray-50'));
                        deleteBtn.style.opacity = '1';
                    });
                     cell.addEventListener('mouseleave', () => {
                        rowCells.forEach(c => c.classList.remove('bg-gray-50'));
                        deleteBtn.style.opacity = '0';
                    });
                });
            });
        }
        
        /**
         * Helper to create a grid cell.
         */
        function createCell(text, classes) {
            const cell = document.createElement('div');
            cell.className = classes;
            cell.textContent = text;
            return cell;
        }

        /**
         * Opens the shift selector modal.
         */
        function openModal(cellElement, empId, empName, fullDate) {
            currentCellElement = cellElement;
            currentEmployeeId = empId;
            currentFullDate = fullDate;
            currentEmployeeName = empName;
            
            modalEmployeeName.textContent = empName;
            modalDate.textContent = new Date(fullDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            shiftOptionsContainer.innerHTML = '';
            
            Object.keys(shiftCodes).forEach(code => {
                const shiftInfo = shiftCodes[code];
                const button = document.createElement('button');
                button.textContent = shiftInfo.text || 'Empty';
                button.className = `p-3 rounded-lg border font-medium transition duration-150 ${shiftInfo.color} ${shiftInfo.textColor} hover:shadow-md hover:ring-2 hover:ring-indigo-400`;
                
                button.addEventListener('click', () => {
                    selectShift(code);
                });
                shiftOptionsContainer.appendChild(button);
            });
            
            modal.classList.remove('hidden');
        }

        /**
         * Closes the shift selector modal.
         */
        function closeModal() {
            modal.classList.add('hidden');
            currentCellElement = null;
            currentEmployeeId = null;
            currentFullDate = null;
            currentEmployeeName = null;
        }

        /**
         * Handles the selection of a new shift from the modal.
         * Saves the change to Firestore.
         */
        async function selectShift(shiftCode) {
            if (!currentCellElement || !currentEmployeeId || !currentFullDate) return;
            
            // 1. Save to Firestore
            const rosterDocRef = doc(rosterCollection, currentEmployeeId);
            try {
                // Use { merge: true } to only update/add this one date
                await setDoc(rosterDocRef, { [currentFullDate]: shiftCode }, { merge: true });
                console.log(`Updated ${currentEmployeeName} on ${currentFullDate} to ${shiftCode}`);
                
                // 2. Close the modal
                closeModal();
                
                // 3. UI update will be handled by the onSnapshot listener
                
            } catch (error) {
                console.error("Error saving shift: ", error);
                // Optionally show an error message to the user
            }
        }
        
        /**
         * Changes the current month and re-renders the roster.
         */
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderRoster();
        }

        // --- NEW/MODIFIED Functions for Firestore ---

        /**
         * Opens the Add Employee modal and populates team datalist.
         */
        function openAddModal() {
            addError.textContent = '';
            teamDataList.innerHTML = '';
            const teams = [...new Set(employeeData.map(emp => emp.team))];
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                teamDataList.appendChild(option);
            });
            addEmployeeModal.classList.remove('hidden');
        }

        /**
         * Closes the Add Employee modal and resets the form.
         */
        function closeAddModal() {
            addEmployeeModal.classList.add('hidden');
            addEmployeeForm.reset();
            addError.textContent = '';
        }

        /**
         * Handles the submission of the new employee form.
         * Saves the new employee to Firestore.
         */
        async function handleAddEmployee(e) {
            e.preventDefault();
            addError.textContent = '';
            
            const newEmployee = {
                team: document.getElementById('emp-team').value.trim(),
                id: document.getElementById('emp-id').value.trim(),
                rank: document.getElementById('emp-rank').value.trim(),
                name: document.getElementById('emp-name').value.trim(),
            };

            // Check for duplicate ID locally first
            if (employeeData.some(emp => emp.id === newEmployee.id)) {
                addError.textContent = 'Error: Employee ID already exists.';
                return;
            }

            // Save to Firestore using the employee ID as the document ID
            try {
                const empDocRef = doc(employeesCollection, newEmployee.id);
                await setDoc(empDocRef, newEmployee);
                
                // UI update will be handled by onSnapshot
                closeAddModal();

            } catch (error) {
                 console.error("Error adding employee: ", error);
                 addError.textContent = 'Error saving employee. Please try again.';
            }
        }

        /**
         * Opens the delete confirmation modal.
         */
        function openDeleteModal(id, name) {
            employeeIdToDelete = id;
            deleteModalName.textContent = name;
            deleteModalId.textContent = id;
            deleteConfirmModal.classList.remove('hidden');
        }

        /**
         * Closes the delete confirmation modal.
         */
        function closeDeleteModal() {
            employeeIdToDelete = null;
            deleteConfirmModal.classList.add('hidden');
        }

        /**
         * Performs the actual deletion of the employee from Firestore.
         */
        async function handleDeleteEmployee() {
            if (!employeeIdToDelete) return;
            
            try {
                // 1. Delete employee document
                const empDocRef = doc(employeesCollection, employeeIdToDelete);
                await deleteDoc(empDocRef);

                // 2. Delete corresponding roster document
                const rosterDocRef = doc(rosterCollection, employeeIdToDelete);
                // Check if roster doc exists before deleting
                const rosterSnap = await getDoc(rosterDocRef);
                if (rosterSnap.exists()) {
                    await deleteDoc(rosterDocRef);
                }
                
                // UI update handled by onSnapshot
                closeDeleteModal();

            } catch (error) {
                console.error("Error deleting employee: ", error);
                // Optionally show an error
            }
        }

        /**
         * Populates Firestore with initial data if the employees collection is empty.
         */
        async function populateInitialData() {
            console.log("Checking for initial data...");
            // **FIX:** Check the 'employees' collection
            const querySnapshot = await getDocs(employeesCollection);
            if (querySnapshot.empty) {
                console.log("No employees found. Populating initial data...");
                const batch = writeBatch(db);
                
                // Add employees
                initialEmployeeData.forEach(emp => {
                    // **FIX:** Use 'employees' collection
                    const empDocRef = doc(employeesCollection, emp.id);
                    batch.set(empDocRef, emp);
                });
                
                // Add roster data
                Object.keys(initialRosterData).forEach(empId => {
                    // **FIX:** Use 'roster' collection
                    const rosterDocRef = doc(rosterCollection, empId);
                    batch.set(rosterDocRef, initialRosterData[empId]);
                });
                
                await batch.commit();
                console.log("Initial data populated.");
            } else {
                console.log("Existing data found. Skipping population.");
            }
        }

        /**
         * Sets up real-time listeners for roster data.
         */
        function setupDataListeners() {
            // 1. Listen for Employee changes
            // **FIX:** Use 'employees' collection
            onSnapshot(query(employeesCollection), (snapshot) => {
                console.log("Employee data updated from Firestore.");
                employeeData = [];
                snapshot.forEach((doc) => {
                    employeeData.push(doc.data());
                });
                
                if (isDataLoaded) {
                    renderRoster(); // Re-render if data is already loaded
                }
            });

            // 2. Listen for Roster changes
            // **FIX:** Use 'roster' collection
            onSnapshot(query(rosterCollection), (snapshot) => {
                 console.log("Roster data updated from Firestore.");
                rosterData = {};
                snapshot.forEach((doc) => {
                    rosterData[doc.id] = doc.data();
                });
                
                if (isDataLoaded) {
                    renderRoster(); // Re-render if data is already loaded
                }
            });
        }
        
        /**
         * Initializes Firebase auth and loads all data.
         */
        async function initFirebase() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    console.log("User authenticated:", user.uid);
                    loadingState.textContent = "Loading Roster Data...";
                    
                    // **FIX:** Define collection paths to root-level
                    employeesCollection = collection(db, "employees");
                    rosterCollection = collection(db, "roster");
                    
                    try {
                        // Check if we need to populate initial data (one-time check)
                        await populateInitialData();
                        
                        // Setup listeners to get and sync data
                        setupDataListeners();
                        
                        // Mark data as loaded and render
                        isDataLoaded = true;
                        loadingState.classList.add('hidden');
                        rosterContainer.classList.remove('hidden');
                        renderRoster();
                    } catch (error) {
                        console.error("Error loading initial data (check Firestore Rules):", error);
                        loadingState.textContent = "Error: Could not read from database. Please check Firestore security rules.";
                    }

                } else {
                    console.log("User not signed in.");
                    loadingState.textContent = "Authenticating...";
                }
            });

            try {
                if (initialAuthToken) {
                    // This will run in Canvas
                    console.log("Signing in with custom token...");
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    // This will run on github.io
                    console.log("Signing in anonymously...");
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                loadingState.textContent = "Authentication Failed. Please refresh.";
            }
        }


        // --- 5. EVENT LISTENERS (DOM) ---
        
        // Month navigation
        prevMonthBtn.addEventListener('click', () => changeMonth(-1));
        nextMonthBtn.addEventListener('click', () => changeMonth(1));
        
        // Shift modal
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Add Employee modal
        addEmployeeBtn.addEventListener('click', openAddModal);
        closeAddModalBtn.addEventListener('click', closeAddModal);
        addEmployeeForm.addEventListener('submit', handleAddEmployee);
        addEmployeeModal.addEventListener('click', (e) => {
            if (e.target === addEmployeeModal) closeAddModal();
        });

        // Delete Employee modal
        cancelDeleteBtn.addEventListener('click', closeDeleteModal);
        confirmDeleteBtn.addEventListener('click', handleDeleteEmployee);
        deleteConfirmModal.addEventListener('click', (e) => {
            if (e.target === deleteConfirmModal) closeDeleteModal();
        });

        // --- 6. INITIALIZATION ---
        
        // Start the Firebase connection and data loading process
        document.addEventListener('DOMContentLoaded', initFirebase);

    </script>
</body>
